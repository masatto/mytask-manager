spring:
  datasource:
    # テストでは本番データを触らないようインメモリDBを使う
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

mytask:
  # 起動時の自動バックアップなどがホームディレクトリに書き込まないよう、ビルド用フォルダーの中にする
  data-dir: target/test-data
  backup-dir: target/test-backups
  # テスト中は時計を動かすので、日付の確認が勝手に走らないようにする（テストでは check() を直接呼ぶ）
  day-check-interval: P365D
